<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morpion · À deux de jouer</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #203b3a; background: #f5f2ea; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 28px 18px; }
    main { width: min(100%, 440px); text-align: center; }
    .eyebrow { margin: 0 0 12px; font-size: 11px; font-weight: 750; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(48px, 11vw, 64px); letter-spacing: -.065em; line-height: 1.1; }
    .intro { margin: 14px 0 28px; color: #647270; font-size: 15px; }
    .players { display: flex; gap: 12px; margin-bottom: 22px; }
    .player { flex: 1; display: flex; align-items: center; justify-content: center; gap: 9px; border: 1px solid #dcded5; border-radius: 12px; padding: 12px; font-size: 13px; color: #647270; transition: background .15s, border-color .15s; }
    .player strong { font-size: 22px; line-height: 1; }
    .player.active { border-color: #285e56; background: #e4ece2; color: #203b3a; }
    .player-o strong { color: #ae543c; }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; border-radius: 20px; background: #e5e5da; }
    .cell { aspect-ratio: 1; min-width: 0; padding: 0; border: 0; border-radius: 10px; background: #fffdf8; color: #285e56; font: 650 clamp(42px, 13vw, 72px)/1 system-ui, sans-serif; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background .15s, transform .15s; }
    .cell:hover:not(:disabled) { background: #eef3e9; transform: translateY(-2px); }
    .cell:disabled { cursor: default; opacity: 1; }
    .cell[data-symbol="O"] { color: #ae543c; }
    .cell.win { background: #d1e6ca; }
    button:focus-visible { outline: 3px solid #ae543c; outline-offset: 4px; }
    #status { margin: 24px 0 18px; min-height: 27px; font-size: 19px; font-weight: 650; }
    #restart { width: 100%; border: 0; border-radius: 12px; background: #203f3b; color: white; padding: 16px 20px; font: 600 15px system-ui, sans-serif; cursor: pointer; }
    #restart:hover { background: #306057; }
    .rule { margin: 20px 0 0; font-size: 12px; line-height: 1.7; color: #647270; }
    @media (max-height: 740px) { body { padding-top: 18px; padding-bottom: 18px; } h1 { font-size: 46px; } .intro { margin: 10px 0 18px; } main { max-width: 360px; } .players { margin-bottom: 14px; } #status { margin-top: 18px; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <p class="eyebrow">Deux joueurs · Un même écran</p>
    <h1 id="title">Morpion</h1>
    <p class="intro">Un peu de stratégie. Trois symboles alignés.</p>
    <div class="players" aria-hidden="true">
      <div id="player-x" class="player active"><strong>X</strong> Joueur X</div>
      <div id="player-o" class="player player-o"><strong>O</strong> Joueur O</div>
    </div>
    <div class="board" role="group" aria-label="Grille de morpion, 3 lignes et 3 colonnes" aria-describedby="status">
      <button class="cell" type="button" aria-label="Ligne 1, colonne 1 : vide"></button>
      <button class="cell" type="button" aria-label="Ligne 1, colonne 2 : vide"></button>
      <button class="cell" type="button" aria-label="Ligne 1, colonne 3 : vide"></button>
      <button class="cell" type="button" aria-label="Ligne 2, colonne 1 : vide"></button>
      <button class="cell" type="button" aria-label="Ligne 2, colonne 2 : vide"></button>
      <button class="cell" type="button" aria-label="Ligne 2, colonne 3 : vide"></button>
      <button class="cell" type="button" aria-label="Ligne 3, colonne 1 : vide"></button>
      <button class="cell" type="button" aria-label="Ligne 3, colonne 2 : vide"></button>
      <button class="cell" type="button" aria-label="Ligne 3, colonne 3 : vide"></button>
    </div>
    <p id="status" role="status" aria-live="polite" aria-atomic="true">Au tour de X</p>
    <button id="restart" type="button">Nouvelle partie</button>
    <p class="rule">Alignez 3 symboles à l’horizontale, à la verticale ou en diagonale.<br>X commence. À vous de jouer !</p>
  </main>
  <script>
    'use strict';
    const cells = Array.from(document.querySelectorAll('.cell'));
    const status = document.getElementById('status');
    const playerX = document.getElementById('player-x');
    const playerO = document.getElementById('player-o');
    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];
    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let finished = false;

    function render() {
      cells.forEach((cell, index) => {
        cell.textContent = board[index];
        cell.dataset.symbol = board[index];
        cell.disabled = finished || board[index] !== '';
        cell.setAttribute('aria-label', `Ligne ${Math.floor(index / 3) + 1}, colonne ${index % 3 + 1} : ${board[index] || 'vide'}`);
      });
      playerX.classList.toggle('active', !finished && currentPlayer === 'X');
      playerO.classList.toggle('active', !finished && currentPlayer === 'O');
    }

    function play(index) {
      if (finished || board[index] !== '') return;
      board[index] = currentPlayer;
      const winningLine = winningLines.find(line => line.every(i => board[i] === currentPlayer));
      if (winningLine) {
        finished = true;
        status.textContent = `${currentPlayer} a gagné !`;
        winningLine.forEach(i => cells[i].classList.add('win'));
      } else if (board.every(Boolean)) {
        finished = true;
        status.textContent = 'Match nul !';
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        status.textContent = `Au tour de ${currentPlayer}`;
      }
      render();
    }

    function resetGame() {
      board = Array(9).fill('');
      currentPlayer = 'X';
      finished = false;
      cells.forEach(cell => cell.classList.remove('win'));
      status.textContent = 'Au tour de X';
      render();
    }

    cells.forEach((cell, index) => cell.addEventListener('click', () => play(index)));
    document.getElementById('restart').addEventListener('click', resetGame);
    render();
  </script>
</body>
</html>
